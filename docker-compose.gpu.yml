# docker-compose.gpu.yml — GPU override for NVIDIA-equipped machines
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Or use setup.sh which auto-detects and applies this override.
#
# Requirements:
#   - NVIDIA GPU
#   - nvidia-container-toolkit installed on the host
#   - Docker configured with nvidia runtime

services:
  llm:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
