[workspace]
members = ["crates/dociler", "crates/dociler-core"]
default-members = ["crates/dociler"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/deanyouknow/llm-docs"
publish = false

[workspace.dependencies]
dociler-core = { path = "crates/dociler-core" }
directories = "=6.0.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tempfile = "=3.19.1"
zeroize = "=1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
