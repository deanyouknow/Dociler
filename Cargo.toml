[workspace]
members = ["crates/dociler", "crates/dociler-core"]
default-members = ["crates/dociler"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/deanyouknow/llm-docs"
publish = false

[workspace.dependencies]
dociler-core = { path = "crates/dociler-core" }
directories = "=6.0.0"
crossterm = "=0.28.1"
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
futures-util = "=0.3.34"
fs2 = "=0.4.3"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
libc = "=0.2.189"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sysinfo = { version = "=0.33.1", default-features = false, features = ["disk", "system"] }
tar = "=0.4.44"
tempfile = "=3.19.1"
tokio = { version = "=1.53.1", features = ["rt", "time"] }
url = "=2.5.4"
unicode-width = "=0.2.0"
zeroize = "=1.8.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
