services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: doc-compiler-llama:latest
    container_name: doc-compiler-llama
    ports:
      # Host port 11435 maps to container port 11434 to avoid port conflicts with Ollama build (11434)
      - "11435:11434"
    volumes:
      # GGUF Model weights persist across restarts in dedicated volume
      - llama_data:/root/models
      # Skills directory — bind-mounted so you can update skills and
      # just restart the container without rebuilding the image
      - ./skills:/root/skills:ro
    environment:
      - MODEL_NAME=doc-compiler
      - MODEL_FILE=qwen2.5-3b-instruct-q4_k_m.gguf
      - LLAMA_CTX_SIZE=8192
      - LLAMA_N_GPU_LAYERS=99
    # Memory cap — model weights are ~2.0 GB, inference overhead adds ~1 GB more.
    mem_limit: 6g
    memswap_limit: 6g
    restart: unless-stopped

volumes:
  # Dedicated volume for llama.cpp models — separate from Ollama volume
  llama_data:
    name: doc-compiler-llama-models
