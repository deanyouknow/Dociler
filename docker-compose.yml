services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    # Override with your registry image after GitLab setup:
    # image: registry.gitlab.com/YOUR_NAMESPACE/llm:latest
    image: doc-compiler-llm:latest
    container_name: doc-compiler-llm
    ports:
      - "11434:11434"
    volumes:
      # Model weights persist across restarts (avoids re-downloading ~2.5 GB)
      - ollama_data:/root/.ollama
      # Skills directory — bind-mounted so you can update skills and
      # just restart the container without rebuilding the image
      - ./skills:/root/skills:ro
    environment:
      # Bind to all interfaces so the API is accessible from the host
      - OLLAMA_HOST=0.0.0.0:11434
      # Process one request at a time (saves significant RAM)
      - OLLAMA_NUM_PARALLEL=1
      # Only keep one model loaded (we only need doc-compiler)
      - OLLAMA_MAX_LOADED_MODELS=1
      # Flash attention — reduces KV cache memory usage significantly
      - OLLAMA_FLASH_ATTENTION=1
      # Override model names via env if needed
      - MODEL_BASE=qwen2.5:3b
      - MODEL_NAME=doc-compiler
    # Memory cap — model weights alone are ~2.5 GB, inference overhead adds ~1 GB more.
    # 6g gives comfortable headroom while still protecting the host.
    # Lower to 4g only if your machine has limited RAM and you accept slower/failed loads.
    mem_limit: 6g
    memswap_limit: 6g
    restart: unless-stopped

volumes:
  # Named volume — survives container rebuilds and updates
  ollama_data:
    name: doc-compiler-models
